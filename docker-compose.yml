services:
  db:
    image: postgres:17
    container_name: gei-ranking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gei
      POSTGRES_PASSWORD: gei_dev_password
      POSTGRES_DB: gei_ranking
    ports:
      - "5433:5432"
    volumes:
      - gei_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gei -d gei_ranking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gei_pgdata:
