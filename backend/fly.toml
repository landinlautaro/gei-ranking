# fly.toml app configuration file generated for gei-ranking-api on 2026-10-03T14:16:54-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gei-ranking-api'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    APP_USER = '0'

[env]
  ASPNETCORE_FORWARDEDHEADERS_ENABLED = 'true'

[[mounts]]
  source = 'gei_photos'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '25s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
